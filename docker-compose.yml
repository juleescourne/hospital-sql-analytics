# Base locale de démonstration. Lancer : bash scripts/run_demo.sh
# Le script génère les fichiers avant le montage et attend le serveur final.

services:
  mysql:
    image: mysql:8.0
    container_name: hospital-analytics-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: hospital
      MYSQL_DATABASE: hospital_analytics
    ports:
      - "3306:3306"
    command:
      # local_infile est requis par db/load_sample_data.sql, et desactive par defaut.
      - --local-infile=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - hospital-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data:/data:ro
    healthcheck:
      test: ["CMD", "mysql", "--protocol=TCP", "-h127.0.0.1", "-uroot", "-phospital", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  hospital-data:
