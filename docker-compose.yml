# Base MySQL prête à l'emploi pour ce projet.
#
#   docker compose up -d
#   python scripts/generate_sample_data.py
#   docker compose exec -T mysql mysql -uroot -phospital hospital_analytics < db/schema.sql
#
# Le schéma est monté en lecture seule dans /docker-entrypoint-initdb.d, donc il est
# appliqué automatiquement à la première création du volume.
#
# Vérifié par .github/workflows/sql-demo.yml. La sonde TCP attend le serveur\n# final, pas le serveur temporaire utilisé pendant l’initialisation.

services:
  mysql:
    image: mysql:8.0
    container_name: hospital-analytics-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: hospital
      MYSQL_DATABASE: hospital_analytics
    ports:
      - "3306:3306"
    command:
      # local_infile est requis par db/load_sample_data.sql, et desactive par defaut.
      - --local-infile=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - hospital-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data:/data:ro
    healthcheck:
      test: ["CMD", "mysql", "--protocol=TCP", "-h127.0.0.1", "-uroot", "-phospital", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  hospital-data:
